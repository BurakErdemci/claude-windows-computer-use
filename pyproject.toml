[project]
name = "claude-windows-computer-use"
version = "0.1.0"
requires-python = ">=3.13"
dependencies = [
    "mcp>=2.2.0,<3",
    "pydantic==2.12.5",
    "anyio==4.12.1",
]

[project.scripts]
windows-computer-use = "windows_computer_use.standalone.__main__:main"

[dependency-groups]
dev = [
    "pytest==9.0.3",
    "pytest-asyncio==1.3.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/windows_computer_use"]

[tool.pytest.ini_options]
asyncio_mode = "auto"
testpaths = ["tests"]
